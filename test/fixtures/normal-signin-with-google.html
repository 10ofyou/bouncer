<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example Shop - Log in</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; }
  .box { max-width: 380px; margin: 80px auto; background: #fff; padding: 32px; border: 1px solid #ddd; border-radius: 8px; }
  input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
  .sso { display: flex; gap: 8px; align-items: center; border: 1px solid #ccc; background: #fff; padding: 8px 12px; width: 100%; }
</style>
</head>
<body>
<!-- Test fixture: an ordinary site with its own login and federated buttons.
     Bouncer must leave this page alone. -->
<div class="box">
  <h1>Log in to Example Shop</h1>
  <form method="POST" action="/collect">
    <input type="email" name="email" placeholder="Email">
    <input type="password" name="password" placeholder="Password">
    <button type="submit">Log in</button>
  </form>
  <p>or</p>
  <button class="sso" type="button"><img src="/static/google-g-logo.svg" alt="Google" width="18" height="18"> Sign in with Google</button>
  <button class="sso" type="button"><img src="/static/microsoft-logo.svg" alt="Microsoft" width="18" height="18"> Continue with Microsoft</button>
  <p>Read about our Google Cloud migration on the blog.</p>
</div>
</body>
</html>
